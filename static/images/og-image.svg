    <rect x="1" y="1" width="46" height="46" rx="11" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.8"/>
    <path d="M24 8L38 16V32L24 40L10 32V16L24 8Z" fill="#2563EB" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1.2"/>
    <rect x="16" y="20" width="3.5" height="13" rx="1" fill="#FFFFFF"/>
