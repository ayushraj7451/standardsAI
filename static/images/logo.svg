<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Gradient for Primary Structural Helix -->
    <linearGradient id="stdAiGrad1" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Gradient for Inner AI Precision Core -->
    <linearGradient id="stdAiGrad2" x1="18" y1="18" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Ambient Shadow & Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Minimalist Rounded Hex-Shield Silhouette -->
  <rect width="48" height="48" rx="14" fill="#0F172A"/>
  <rect x="1" y="1" width="46" height="46" rx="13" stroke="url(#stdAiGrad1)" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Minimalist Geometric "S" Neural Standard Ribbon -->
  <!-- Upper loop of 'S' -->
  <path d="M33 16.5C33 13.46 30.54 11 27.5 11H20.5C16.91 11 14 13.91 14 17.5C14 20.8 16.48 23.53 19.7 23.94L28.3 25.06C31.52 25.47 34 28.2 34 31.5C34 35.09 31.09 38 27.5 38H19.5C16.46 38 14 35.54 14 32.5" 
        stroke="url(#stdAiGrad1)" 
        stroke-width="3.6" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#softGlow)"/>

  <!-- Standards Horizon Line (Signifying Indian Standards Benchmark) -->
  <line x1="11" y1="24.5" x2="16" y2="24.5" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <line x1="32" y1="24.5" x2="37" y2="24.5" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Central Precision AI Spark (4-Point Diamond signifying Certified Standard & AI intelligence) -->
  <path d="M24 20L25.8 23.5L29 24.5L25.8 25.5L24 29L22.2 25.5L19 24.5L22.2 23.5L24 20Z" fill="url(#stdAiGrad2)"/>
  <circle cx="24" cy="24.5" r="1.2" fill="#FFFFFF"/>
</svg>
